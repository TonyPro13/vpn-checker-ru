# Minimal Mihomo configuration for the Yandex Cloud Function probe.
# No VPN keys are checked yet.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

profile:
  store-selected: false
  store-fake-ip: false

proxies: []
proxy-groups: []

rules:
  - MATCH,DIRECT
