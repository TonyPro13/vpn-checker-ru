name: Collect VPN configs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        run: MAX_UNIQUE=0 python collector.py

      - name: Show collection statistics
        run: |
          echo "===== collect_stats.json ====="
          cat output/collect_stats.json
          echo
          echo "===== unique config count ====="
          wc -l output/unique.txt

      - name: Commit collection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/unique.txt output/collect_stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update collected VPN configs"
            git push
          fi
