name: Build Yandex RU Mihomo 10000 Output

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Download latest stable Mihomo
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')"
          test -n "$TAG"
          test "$TAG" != "null"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-compatible-${TAG}.gz"

          curl -fL --retry 3 "$URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v

          if ldd ./mihomo 2>&1 | grep -Eq '=>|ld-linux'; then
            echo "::error::Mihomo binary appears dynamically linked."
            ldd ./mihomo || true
            exit 1
          fi

      - name: Convert all current configs and preserve original URI mapping
        run: |
          python yandex_probe/build_ru_output_batch.py \
            --input output/unique.txt \
            --limit 10000 \
            --output-dir yandex_probe/generated_ru_output

          echo "===== conversion metadata ====="
          cat yandex_probe/generated_ru_output/meta.json

          echo
          echo "===== mapping entries ====="
          jq 'length' yandex_probe/generated_ru_output/mapping.json

      - name: Remove only configs rejected by Mihomo syntax validation
        run: |
          python yandex_probe/sanitize_mihomo_config.py \
            --mihomo ./mihomo \
            --config yandex_probe/generated_ru_output/config.yaml \
            --meta yandex_probe/generated_ru_output/meta.json \
            --rejected yandex_probe/generated_ru_output/mihomo_rejected.json

          echo
          echo "===== sanitized metadata ====="
          cat yandex_probe/generated_ru_output/meta.json

          echo
          echo "===== rejected count ====="
          jq 'length' yandex_probe/generated_ru_output/mihomo_rejected.json

      - name: Split sanitized config into 1000-proxy RU chunks
        run: |
          python yandex_probe/split_mihomo_batches.py \
            --config yandex_probe/generated_ru_output/config.yaml \
            --meta yandex_probe/generated_ru_output/meta.json \
            --output-dir yandex_probe/generated_ru_output/chunks \
            --chunk-size 1000

          echo "===== manifest ====="
          cat yandex_probe/generated_ru_output/chunks/manifest.json

      - name: Validate every exact RU chunk
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            echo "Validating $file"
            ./mihomo -t -f "$file"
          done < <(find yandex_probe/generated_ru_output/chunks -name 'config_*.yaml' | sort)

      - name: Build RU output package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package_ru_output
          mkdir package_ru_output

          cp mihomo package_ru_output/mihomo
          cp yandex_probe/handler_ru_10000_output.sh package_ru_output/handler.sh
          cp yandex_probe/generated_ru_output/meta.json package_ru_output/meta.json
          cp yandex_probe/generated_ru_output/mapping.json package_ru_output/mapping.json
          cp yandex_probe/generated_ru_output/chunks/manifest.json package_ru_output/manifest.json
          cp yandex_probe/generated_ru_output/chunks/config_*.yaml package_ru_output/

          chmod +x package_ru_output/handler.sh package_ru_output/mihomo

          cd package_ru_output
          zip -9 ../yandex-mihomo-ru-10000-output.zip \
            handler.sh meta.json mapping.json manifest.json config_*.yaml mihomo
          cd ..

          echo "===== package ====="
          ls -lh yandex-mihomo-ru-10000-output.zip

      - name: Upload RU output artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-mihomo-ru-10000-output
          path: |
            yandex-mihomo-ru-10000-output.zip
            yandex_probe/generated_ru_output/meta.json
            yandex_probe/generated_ru_output/mihomo_rejected.json
          if-no-files-found: error
          retention-days: 7
