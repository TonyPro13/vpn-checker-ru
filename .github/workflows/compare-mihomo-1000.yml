name: Compare Mihomo 1000 GitHub vs Yandex

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Download latest stable Mihomo
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')"
          test -n "$TAG"
          test "$TAG" != "null"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-compatible-${TAG}.gz"

          curl -fL --retry 3 "$URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v

          if ldd ./mihomo 2>&1 | grep -Eq '=>|ld-linux'; then
            echo "::error::Mihomo binary appears dynamically linked."
            ldd ./mihomo || true
            exit 1
          fi

      - name: Build deterministic 1000-config sample
        run: |
          python yandex_probe/build_compare_batch.py \
            --input output/unique.txt \
            --limit 1000 \
            --output-dir yandex_probe/generated_1000

          echo "===== sample metadata before Mihomo validation ====="
          jq 'del(.sample_source_indexes)' yandex_probe/generated_1000/meta.json

      - name: Remove configs rejected by Mihomo
        run: |
          python yandex_probe/sanitize_mihomo_config.py \
            --mihomo ./mihomo \
            --config yandex_probe/generated_1000/config.yaml \
            --meta yandex_probe/generated_1000/meta.json \
            --rejected yandex_probe/generated_1000/mihomo_rejected.json

          echo
          echo "===== sample metadata after Mihomo validation ====="
          jq 'del(.sample_source_indexes)' yandex_probe/generated_1000/meta.json

          echo
          echo "===== rejected by Mihomo ====="
          cat yandex_probe/generated_1000/mihomo_rejected.json

      - name: Final validate exact Mihomo config
        shell: bash
        run: |
          set -euo pipefail
          ./mihomo -t -f yandex_probe/generated_1000/config.yaml

      - name: Run exact sanitized Mihomo test on GitHub
        run: |
          python yandex_probe/run_mihomo_group_test.py \
            --mihomo ./mihomo \
            --config yandex_probe/generated_1000/config.yaml \
            --meta yandex_probe/generated_1000/meta.json \
            --output github-mihomo-1000-result.json \
            --label github

      - name: Build Yandex package from the SAME sanitized config
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package_1000
          mkdir package_1000

          cp mihomo package_1000/mihomo
          cp yandex_probe/handler_compare_1000.sh package_1000/handler.sh
          cp yandex_probe/generated_1000/config.yaml package_1000/config.yaml
          cp yandex_probe/generated_1000/meta.json package_1000/meta.json

          chmod +x package_1000/handler.sh package_1000/mihomo

          cd package_1000
          zip -9 ../yandex-mihomo-compare-1000.zip handler.sh config.yaml meta.json mihomo
          cd ..

          echo "===== GitHub result summary ====="
          jq 'del(.delays)' github-mihomo-1000-result.json

          echo
          echo "===== Yandex package ====="
          ls -lh yandex-mihomo-compare-1000.zip

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-compare-1000
          path: |
            yandex-mihomo-compare-1000.zip
            github-mihomo-1000-result.json
            yandex_probe/generated_1000/meta.json
            yandex_probe/generated_1000/mihomo_rejected.json
          if-no-files-found: error
          retention-days: 7
